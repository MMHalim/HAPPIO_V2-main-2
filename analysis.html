<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analysis Dashboard</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="global-theme.css" />
  <script>
    (function () {
      const originalWarn = console.warn;
      console.warn = function (...args) {
        const firstArg = args.length ? String(args[0] || '') : '';
        if (firstArg.includes('cdn.tailwindcss.com should not be used in production')) {
          return;
        }
        return originalWarn.apply(console, args);
      };
    }());
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="global-navigation.js?v=20260916-03" defer></script>
    <script src="analysis.js?v=20261019-01" defer></script>
  <style>
    .page-content { padding: 24px; max-width: 1520px; margin: 0 auto; }
    .analysis-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }
    .analysis-muted { color: var(--text-secondary); }
    .analysis-input,
    .analysis-select,
    .analysis-textarea {
      width: 100%;
      border: 1px solid var(--border-color);
      background: var(--bg-nav-item);
      color: var(--text-primary);
      border-radius: 14px;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .analysis-select {
      appearance: none;
      -webkit-appearance: none;
      -moz-appearance: none;
      color-scheme: dark;
    }
    .analysis-select option,
    .analysis-select optgroup {
      background: #111827;
      color: #f8fafc;
    }
    [data-theme="light"] .analysis-select {
      color-scheme: light;
    }
    [data-theme="light"] .analysis-select option,
    [data-theme="light"] .analysis-select optgroup {
      background: #ffffff;
      color: #0f172a;
    }
    .analysis-input:focus,
    .analysis-select:focus,
    .analysis-textarea:focus {
      border-color: rgba(99, 102, 241, 0.55);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }
      .analysis-input:disabled,
      .analysis-select:disabled,
      .analysis-textarea:disabled {
        opacity: 0.72;
        cursor: not-allowed;
      }
    .analysis-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      padding: 11px 16px;
      font-weight: 700;
      transition: transform 0.16s ease, opacity 0.2s ease, background 0.2s ease, border-color 0.2s ease;
      border: 1px solid transparent;
    }
    .analysis-btn:hover { transform: translateY(-1px); }
    .analysis-btn-primary {
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      color: white;
      box-shadow: 0 14px 28px rgba(99, 102, 241, 0.28);
    }
    .analysis-btn-secondary {
      background: var(--bg-nav-item);
      color: var(--text-primary);
      border-color: var(--border-color);
    }
    .analysis-btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: #ef4444;
      border-color: rgba(239, 68, 68, 0.22);
    }
    [data-theme="light"] .analysis-btn-danger {
      background: rgba(239, 68, 68, 0.08);
      color: #dc2626;
      border-color: rgba(239, 68, 68, 0.18);
    }
    .analysis-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: var(--bg-nav-item);
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 700;
      border: 1px solid var(--border-color);
    }
    .analysis-chip-active {
      background: rgba(99, 102, 241, 0.16);
      color: #c4b5fd;
      border-color: rgba(129, 140, 248, 0.35);
    }
    [data-theme="light"] .analysis-chip-active {
      background: rgba(99, 102, 241, 0.1);
      color: #4338ca;
    }
    .analysis-dropdown {
      position: relative;
    }
    .analysis-dropdown-trigger {
      list-style: none;
      display: flex;
      width: 100%;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border: 1px solid var(--border-color);
      background: var(--bg-nav-item);
      color: var(--text-primary);
      border-radius: 14px;
      padding: 12px 14px;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }
    .analysis-dropdown-trigger::-webkit-details-marker {
      display: none;
    }
    .analysis-dropdown[open] .analysis-dropdown-trigger,
    .analysis-dropdown-trigger:focus {
      border-color: rgba(99, 102, 241, 0.55);
      box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
    }
    .analysis-dropdown-summary {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .analysis-dropdown-panel {
      position: absolute;
      z-index: 30;
      top: calc(100% + 8px);
      left: 0;
      right: 0;
      border: 1px solid var(--border-color);
      border-radius: 16px;
      background: var(--bg-card);
      box-shadow: var(--shadow);
      padding: 12px;
    }
    .analysis-checklist {
      display: flex;
      max-height: 220px;
      flex-direction: column;
      gap: 6px;
      overflow-y: auto;
    }
    .analysis-checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      border-radius: 12px;
      padding: 8px 10px;
      color: var(--text-primary);
      transition: background 0.18s ease;
    }
    .analysis-checkbox-item:hover {
      background: rgba(99, 102, 241, 0.08);
    }
    .analysis-checkbox-item-all {
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      background: var(--bg-nav-item);
    }
    .analysis-checkbox-item input {
      height: 15px;
      width: 15px;
      accent-color: #6366f1;
    }
    .kpi-card {
      min-height: 154px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .kpi-card-compact {
      min-height: 0;
      padding-top: 18px;
      padding-bottom: 18px;
      gap: 10px;
    }
    .channel-breakdown-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .channel-breakdown-card {
      border: 1px solid var(--border-color);
      background: var(--bg-nav-item);
      border-radius: 16px;
      padding: 12px;
    }
    .channel-breakdown-body {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    .channel-chart-wrap {
      display: flex;
      justify-content: center;
    }
    .mini-pie-chart {
      position: relative;
      width: 118px;
      height: 118px;
      border-radius: 999px;
      flex: 0 0 118px;
    }
    .mini-pie-chart-inner {
      position: absolute;
      inset: 18px;
      border-radius: inherit;
      background: var(--bg-card);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-primary);
      font-size: 15px;
      font-weight: 800;
      border: 1px solid var(--border-color);
      text-align: center;
    }
    .channel-legend {
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .channel-legend-item {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px;
      font-size: 13px;
      color: var(--text-secondary);
    }
    .channel-legend-label {
      min-width: 0;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--text-primary);
      font-weight: 700;
      overflow: hidden;
    }
    .channel-legend-value {
      white-space: nowrap;
      font-weight: 700;
      font-size: 12px;
      text-align: right;
      line-height: 1.2;
    }
    .channel-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      display: inline-block;
      flex: 0 0 9px;
    }
      .team-score-shell {
        margin-top: 20px;
        border: 1px solid var(--border-color);
        border-radius: 20px;
        background: linear-gradient(180deg, rgba(99, 102, 241, 0.08), rgba(15, 23, 42, 0.12));
        padding: 18px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
      }
      .team-score-toolbar {
        display: flex;
        flex-wrap: nowrap;
        gap: 10px;
        align-items: center;
        width: min(100%, 500px);
      }
      .team-score-search {
        min-width: 0;
        flex: 1 1 auto;
      }
      .team-score-export {
        flex: 0 0 150px;
        min-width: 140px;
      }
      @media (max-width: 720px) {
        .team-score-toolbar {
          flex-wrap: wrap;
          width: 100%;
        }
        .team-score-search,
        .team-score-export {
          flex: 1 1 100%;
          min-width: 100%;
        }
      }
      .team-score-table-wrap {
        margin-top: 16px;
        overflow: auto;
        max-height: 540px;
        border: 1px solid rgba(129, 140, 248, 0.22);
        border-radius: 18px;
        background: var(--bg-card);
      }
      .team-score-table {
        width: 100%;
        border-collapse: collapse;
        min-width: 620px;
      }
      .team-score-table th,
      .team-score-table td {
        padding: 14px 16px;
        border-bottom: 1px solid var(--border-color);
        text-align: left;
      }
      .team-score-table th {
        font-size: 12px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--text-secondary);
        background: rgba(17, 24, 39, 0.96);
        position: sticky;
        top: 0;
        z-index: 1;
        backdrop-filter: blur(10px);
      }
      .team-score-table td {
        font-size: 14px;
        color: var(--text-primary);
        background: transparent;
      }
      .team-score-table tbody tr:last-child td {
        border-bottom: 0;
      }
      .team-score-table tbody tr:hover td {
        background: rgba(99, 102, 241, 0.07);
      }
      .team-score-agent-cell {
        font-weight: 700;
      }
      .team-score-value {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 78px;
        padding: 6px 10px;
        border-radius: 999px;
        font-weight: 800;
        border: 1px solid transparent;
      }
      .team-score-value.score-good {
        color: #86efac;
        background: rgba(34, 197, 94, 0.12);
        border-color: rgba(34, 197, 94, 0.22);
      }
      .team-score-value.score-mid {
        color: #fcd34d;
        background: rgba(245, 158, 11, 0.12);
        border-color: rgba(245, 158, 11, 0.22);
      }
      .team-score-value.score-bad {
        color: #fda4af;
        background: rgba(239, 68, 68, 0.12);
        border-color: rgba(239, 68, 68, 0.22);
      }
      [data-theme="light"] .team-score-value.score-good {
        color: #15803d;
        background: rgba(34, 197, 94, 0.1);
        border-color: rgba(34, 197, 94, 0.18);
      }
      [data-theme="light"] .team-score-value.score-mid {
        color: #b45309;
        background: rgba(245, 158, 11, 0.12);
        border-color: rgba(245, 158, 11, 0.18);
      }
      [data-theme="light"] .team-score-value.score-bad {
        color: #b91c1c;
        background: rgba(239, 68, 68, 0.1);
        border-color: rgba(239, 68, 68, 0.18);
      }
      .team-score-overall,
      .team-score-value.team-score-overall,
      .team-score-value.score-good.team-score-overall,
      .team-score-value.score-mid.team-score-overall,
      .team-score-value.score-bad.team-score-overall {
        font-weight: 800;
      }
      .team-score-empty {
        text-align: center;
        color: var(--text-secondary);
        padding-top: 28px;
        padding-bottom: 28px;
      }
      [data-theme="light"] .team-score-shell {
        background: linear-gradient(180deg, rgba(99, 102, 241, 0.04), rgba(99, 102, 241, 0.02));
      }
      [data-theme="light"] .team-score-table th {
        background: rgba(99, 102, 241, 0.06);
      }
    .source-chip-t1 {
      background: rgba(59, 130, 246, 0.14);
      color: #93c5fd;
      border-color: rgba(59, 130, 246, 0.25);
    }
    .source-chip-t2os {
      background: rgba(139, 92, 246, 0.14);
      color: #c4b5fd;
      border-color: rgba(139, 92, 246, 0.25);
    }
    [data-theme="light"] .source-chip-t1 {
      background: rgba(59, 130, 246, 0.08);
      color: #1d4ed8;
    }
    [data-theme="light"] .source-chip-t2os {
      background: rgba(139, 92, 246, 0.08);
      color: #6d28d9;
    }
    .kpi-value {
      font-size: 2rem;
      line-height: 1;
      font-weight: 800;
      color: var(--text-primary);
    }
    .progress-track {
      height: 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.2);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f59e0b, #f97316);
    }
    .segment-btn,
    .tab-btn,
    .quick-filter-btn {
      border: 1px solid var(--border-color);
      background: var(--bg-nav-item);
      color: var(--text-secondary);
      border-radius: 12px;
      font-weight: 700;
      transition: all 0.2s ease;
    }
    .segment-btn:hover,
    .tab-btn:hover,
    .quick-filter-btn:hover {
      color: var(--text-primary);
      border-color: rgba(129, 140, 248, 0.35);
    }
    .segment-btn.active,
    .tab-btn.active,
    .quick-filter-btn.active {
      color: white;
      border-color: transparent;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      box-shadow: 0 10px 24px rgba(99, 102, 241, 0.22);
    }
    .breakdown-card.active {
      border-color: rgba(129, 140, 248, 0.48);
      box-shadow: 0 0 0 1px rgba(129, 140, 248, 0.28), 0 18px 36px rgba(79, 70, 229, 0.16);
    }
    .ticket-card {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .ticket-card + .ticket-card { margin-top: 16px; }
    .ticket-attr {
      border-radius: 16px;
      border: 1px solid rgba(239, 68, 68, 0.18);
      background: rgba(239, 68, 68, 0.08);
      padding: 14px;
    }
    [data-theme="light"] .ticket-attr {
      background: rgba(239, 68, 68, 0.05);
      border-color: rgba(239, 68, 68, 0.14);
    }
    .distribution-row + .distribution-row { margin-top: 14px; }
    .distribution-track {
      height: 12px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.18);
      overflow: hidden;
    }
    .distribution-fill {
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #f43f5e, #ef4444);
    }
    .feedback-card {
      padding: 18px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .feedback-item {
      border-radius: 14px;
      padding: 12px 14px;
      background: var(--bg-nav-item);
      border: 1px solid var(--border-color);
    }
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 23, 0.72);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10020;
      padding: 20px;
      backdrop-filter: blur(6px);
    }
    .modal-overlay.active { display: flex; }
    .modal-card {
      width: min(820px, 100%);
      max-height: min(88vh, 960px);
      overflow: auto;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      box-shadow: 0 28px 70px rgba(15, 23, 42, 0.45);
      padding: 24px;
    }
    .toast-container {
      position: fixed;
      bottom: 24px;
      right: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 10030;
      pointer-events: none;
    }
    .toast {
      min-width: 280px;
      max-width: 420px;
      padding: 14px 16px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      background: #111827;
      color: #f8fafc;
      box-shadow: 0 18px 40px rgba(2, 6, 23, 0.35);
      pointer-events: auto;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      animation: slideIn 0.22s ease forwards;
    }
    .toast.success { border-color: rgba(16, 185, 129, 0.35); }
    .toast.error { border-color: rgba(239, 68, 68, 0.35); }
    .toast.warning { border-color: rgba(245, 158, 11, 0.35); }
    [data-theme="light"] .toast {
      background: #ffffff;
      color: #0f172a;
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (min-width: 768px) {
      .channel-breakdown-grid {
        grid-template-columns: 1fr;
      }
      .channel-breakdown-body {
        grid-template-columns: minmax(0, 118px) minmax(0, 1fr);
        align-items: center;
      }
    }
  </style>
</head>
<body>
  <div class="page-content">
    <div id="analysisRoot" class="flex flex-col gap-6">
      <section class="analysis-card p-10 text-center">
        <div class="mx-auto mb-4 flex h-12 w-12 items-center justify-center rounded-2xl bg-indigo-500/20 text-indigo-300">
          <i data-lucide="loader-circle" class="h-6 w-6 animate-spin"></i>
        </div>
        <h1 class="text-2xl font-extrabold text-[var(--text-primary)]">Loading Analysis Dashboard</h1>
        <p class="analysis-muted mt-3 text-sm">Fetching T1 and T2 OS evaluations from Supabase.</p>
      </section>
    </div>
  </div>

  <div id="logModal" class="modal-overlay" aria-hidden="true">
    <div class="modal-card">
      <div class="mb-5 flex items-start justify-between gap-4">
        <div>
          <h2 class="text-2xl font-extrabold text-[var(--text-primary)]">Log Evaluation</h2>
          <p class="analysis-muted mt-1 text-sm">Add a session-only evaluation row to test the dashboard flow.</p>
        </div>
        <button type="button" class="analysis-btn analysis-btn-secondary !px-3 !py-3" data-close-modal="logModal">
          <i data-lucide="x" class="h-4 w-4"></i>
        </button>
      </div>
      <form id="logEvaluationForm" class="grid grid-cols-1 gap-4 md:grid-cols-2">
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Source Sheet</span>
          <select id="logSource" class="analysis-select">
            <option value="t1">T1_QA_New_Scorecards</option>
            <option value="t2os">T2_OS_NEW_2025</option>
          </select>
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Agent</span>
          <input id="logAgent" class="analysis-input" required placeholder="Agent name" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Evaluation Date</span>
          <input id="logDate" type="datetime-local" class="analysis-input" required />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Ticket / Conversation ID</span>
          <input id="logConversationId" class="analysis-input" placeholder="Conversation ID" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Final Score (%)</span>
          <input id="logScore" type="number" min="0" max="100" step="0.1" class="analysis-input" required placeholder="83.7" />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Channel</span>
          <input id="logChannel" class="analysis-input" placeholder="Phone, Chat, Email..." />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Ticket Status</span>
          <input id="logTicketStatus" class="analysis-input" placeholder="Done, Open, Snoozed..." />
        </label>
        <label class="block">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Monitoring Type</span>
          <input id="logMonitoringType" class="analysis-input" placeholder="Remote, SBS, Selected..." />
        </label>
        <label class="block md:col-span-2">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Interaction Topic</span>
          <input id="logTopic" class="analysis-input" placeholder="Interaction related to" />
        </label>
        <label class="block md:col-span-2">
          <span class="mb-2 block text-sm font-semibold text-[var(--text-primary)]">Failed Attributes</span>
          <textarea id="logFailedAttributes" rows="6" class="analysis-textarea" placeholder="One per line. Example:&#10;Soft Skills: Missed the empathy statement.&#10;Understanding: No paraphrasing before offering the solution."></textarea>
        </label>
        <div class="md:col-span-2 flex justify-end gap-3 pt-2">
          <button type="button" class="analysis-btn analysis-btn-secondary" data-close-modal="logModal">Cancel</button>
          <button type="submit" class="analysis-btn analysis-btn-primary">Add Row</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>
</body>
</html>
